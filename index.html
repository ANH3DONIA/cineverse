<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>CineVerse - Portal de Películas</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar" aria-label="Navegación principal">
    <div class="nav-container">
      <a href="/" class="nav-logo" aria-label="CineVerse - Inicio">
        <span class="logo-text">CineVerse</span>
      </a>
      <ul class="nav-links" role="list">
        <li><a href="/" class="nav-link active" aria-current="page">Inicio</a></li>
        <li><a href="/catalogo.html" class="nav-link">Catálogo</a></li>
        <li><a href="/registro.html" class="nav-link nav-link--cta">Registrarse</a></li>
      </ul>
      <button class="nav-toggle" aria-label="Abrir menú" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <header class="hero" id="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1 class="hero-title">Descubre el Mundo del Cine</h1>
      <p class="hero-subtitle">Explora las películas más populares, mejor valoradas y los últimos estrenos.</p>
      <a href="/catalogo.html" class="btn btn-primary btn-lg">Explorar Catálogo</a>
    </div>
  </header>

  <main>
    <section class="section" aria-labelledby="trending-title">
      <div class="container">
        <h2 id="trending-title" class="section-title">En Tendencia</h2>
        <div class="movie-grid" id="trending-movies" aria-live="polite">
          <div class="loading-skeleton" aria-label="Cargando películas...">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section section--alt" aria-labelledby="toprated-title">
      <div class="container">
        <h2 id="toprated-title" class="section-title">Mejor Valoradas</h2>
        <div class="movie-grid" id="toprated-movies" aria-live="polite">
          <div class="loading-skeleton" aria-label="Cargando películas...">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="section" aria-labelledby="upcoming-title">
      <div class="container">
        <h2 id="upcoming-title" class="section-title">Próximos Estrenos</h2>
        <div class="movie-grid" id="upcoming-movies" aria-live="polite">
          <div class="loading-skeleton" aria-label="Cargando películas...">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container">
      <p>CineVerse - Proyecto Unidad 3 | Datos proporcionados por <a href="https://www.themoviedb.org/" target="_blank" rel="noopener noreferrer">TMDB</a></p>
    </div>
  </footer>

  <script src="/js/app.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
